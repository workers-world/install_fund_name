name: Build and Push Image

# 仅 master 推 GHCR（与 container-actions 约定一致）
on:
  push:
    branches: [master]
  schedule:
    # 每周日 UTC 13:00（北京周日 21:00），早于 fund-info-worker 的 14:00
    - cron: "0 13 * * 0"
  workflow_dispatch:

jobs:
  build-push:
    permissions:
      contents: read
      packages: write
    uses: workers-world/container-actions/.github/workflows/container-build-push.yml@actions/v0.1.0
    secrets:
      DISPATCH_TOKEN: ${{ secrets.GHA_TOKEN }}
    with:
      image: ghcr.io/workers-world/install_fund_name
      # fund-info 用 refresh-and-deploy cron，暂不强制 dispatch
      emit_dispatch: false
