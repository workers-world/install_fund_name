# Release PR CI：push dev_* → verify + 开 PR；PR → master 门禁后 auto-merge。
# 公开仓须走公开 worker-actions（勿 uses 私有 workers-world/.github）。
# pin actions/v0.1.2（与 tal1 等公开仓一致；v0.1.3 workflow-lint 的 zizmor PATH 有 bug）
# 前置：Org Secret GHA_TOKEN 等，caller 显式 secrets 映射
# sync-default-branch.yml 为独立 workflow，勿并入本文件
name: CI

on:
  push:
    branches: ["dev_*"]
  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    permissions:
      contents: write
      packages: read
      pull-requests: write
      issues: write
      actions: write
      checks: read
    uses: workers-world/worker-actions/.github/workflows/worker-ci.yml@actions/v0.2.6
    secrets:
      GHA_TOKEN: ${{ secrets.GHA_TOKEN }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
      OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
      OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
      OCR_LLM_EXTRA_HEADERS: ${{ secrets.OCR_LLM_EXTRA_HEADERS }}
      NOTIFY_GHA_TOKEN: ${{ secrets.NOTIFY_GHA_TOKEN }}
    with:
      materialize_sdk: false
      run_tests: false
      sync_packages_lock: false
