# 独立 workflow：与 CI 解耦。公开仓须走公开 worker-actions（勿 uses 私有 workers-world/.github）。
# workers-world actions bundle: actions/v0.1.3（禁止 @master）
# 写操作走 GHA_TOKEN（PAT）；GITHUB_TOKEN 无权限。
# 前置：Org Secret GHA_TOKEN（或与 WORKERS_WORLD_GHA_TOKEN 同值的 GHA_TOKEN），secrets: inherit
name: Sync default branch

on:
  push:
    branches: ["dev_*"]

permissions: {}

concurrency:
  group: sync-default-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    permissions: {}
    uses: workers-world/worker-actions/.github/workflows/worker-sync-default-dev-branch.yml@actions/v0.1.3
    secrets: inherit
    with:
      push_branch: ${{ github.ref_name }}
