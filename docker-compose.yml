services:
  api:
    build: .
    container_name: instrument-lookup-api
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      CACHE_ONLY: "1"
    volumes:
      - ./data:/app/data
    # 容器内无法直连境内 HTTPS，需先在宿主机刷新缓存：
    #   source .venv/bin/activate && python scripts/refresh_cache.py
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
